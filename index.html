<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Live</title>
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* ----------------------------------
           1. パスワード入力画面 (モノトーン)
        ---------------------------------- */
        #auth-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            letter-spacing: 4px;
        }

        #auth-container h1 {
            font-size: 18px;
            font-weight: 200;
            margin-bottom: 25px;
            color: #fff;
            text-transform: uppercase;
        }

        #password-input {
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid #ffffff;
            background-color: #000;
            color: #fff;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            width: 220px;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
        }

        #password-input:focus {
            background-color: #fff;
            color: #000;
        }

        #error-msg {
            color: #888;
            margin-top: 15px;
            font-size: 11px;
            letter-spacing: 1px;
            height: 15px;
        }

        /* ----------------------------------
           2. 動画プレイヤー領域（画面ピッタリ）
        ---------------------------------- */
        #player-container {
            display: none;
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }

        /* iframeは画面100%ピッタリに収める */
        #player-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ----------------------------------
           3. 右下ロゴ覆い用 黒カバーブロック
        ---------------------------------- */
        #logo-cover {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 140px;      /* ロゴの幅に合わせて必要に応じて調整 */
            height: 60px;      /* ロゴの高さに合わせて必要に応じて調整 */
            background-color: #000;
            z-index: 5;        /* iframeより前面に配置 */
            pointer-events: none; /* マウス操作を透過させる */
        }

        /* ----------------------------------
           4. FULL SCREEN ボタン (右上)
        ---------------------------------- */
        #fullscreen-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 10px 18px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease, background-color 0.2s ease, color 0.2s ease;
        }

        #fullscreen-btn:hover {
            background-color: #fff;
            color: #000;
            border-color: #fff;
        }

        /* マウス動作時に表示 */
        #player-container.show-controls #fullscreen-btn {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <!-- パスワード入力画面 -->
    <div id="auth-container">
        <h1>PASSWORD</h1>
        <input type="password" id="password-input" autofocus>
        <div id="error-msg"></div>
    </div>

    <!-- プレイヤー画面 -->
    <div id="player-container">
        <!-- YouTube 画面 -->
        <iframe 
            id="youtube-frame"
            src="" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            allowfullscreen>
        </iframe>

        <!-- 右下のロゴを遮蔽する真っ黒なブロックカバー -->
        <div id="logo-cover"></div>

        <!-- 右上のフルスクリーン切替ボタン -->
        <button id="fullscreen-btn" onclick="toggleFullScreen()">FULL SCREEN</button>
    </div>

    <script>
        const passInput = document.getElementById('password-input');
        const authContainer = document.getElementById('auth-container');
        const playerContainer = document.getElementById('player-container');
        const errorMsg = document.getElementById('error-msg');
        const youtubeFrame = document.getElementById('youtube-frame');

        // パスワード判定
        function checkPassword() {
            if (passInput.value === 'terracaster') {
                authContainer.style.display = 'none';
                playerContainer.style.display = 'block';

                // YouTube URLの読み込み (最高画質リクエスト & コントロール最小化)
                youtubeFrame.src = "https://www.youtube.com/embed/9PJXj4Tbr0c?autoplay=1&vq=hd1080&controls=0&modestbranding=1&rel=0";
            } else {
                errorMsg.textContent = 'INCORRECT PASSWORD';
                passInput.value = '';
            }
        }

        passInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // マウス静止時にボタンをフェードアウトさせる処理
        let hideTimeout;
        playerContainer.addEventListener('mousemove', function() {
            playerContainer.classList.add('show-controls');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(function() {
                playerContainer.classList.remove('show-controls');
            }, 2500);
        });

        // フルスクリーン切替処理
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>

</body>
</html>
